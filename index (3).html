<!DOCTYPE html>
<html lang="rw" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ikibazo cy’ingenzi kuri Divine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe3ee;--bg2:#e9d8ff;--ink:#3a1650;--card:#ffffffcc;--rose:#e8326b;--rose-ink:#fff;--no:#6b5a7a;--star:#ff9ec0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1d0a2e;--bg2:#3b1252;--ink:#fff1f6;--card:#ffffff14;--rose:#ff5d8f;--rose-ink:#2a0a1a;--no:#cbb8dc;--star:#ffd1e1}}
:root[data-theme="dark"]{--bg1:#1d0a2e;--bg2:#3b1252;--ink:#fff1f6;--card:#ffffff14;--rose:#ff5d8f;--rose-ink:#2a0a1a;--no:#cbb8dc;--star:#ffd1e1}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;overflow:hidden;display:grid;place-items:center;padding:16px}
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.sky span{position:absolute;bottom:-40px;color:var(--star);opacity:.55;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.card{position:relative;width:min(100%,420px);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #ffffff44;border-radius:28px;padding:34px 24px 28px;text-align:center;box-shadow:0 20px 60px #0003}
.emoji{font-size:64px;line-height:1;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
h1{font-family:'Fredoka','Tajawal',system-ui,sans-serif;font-size:clamp(30px,8vw,40px);margin:14px 0 6px;font-weight:600}
p{margin:0 auto;max-width:30ch;font-size:18px;line-height:1.7}
.msg{min-height:3.4em;margin-top:14px;font-size:16px;opacity:.85}
.row{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:22px;min-height:70px}
button{font-family:inherit;font-weight:700;border:0;border-radius:999px;cursor:pointer;transition:transform .15s}
#yes{background:var(--rose);color:var(--rose-ink);font-size:20px;padding:14px 36px;box-shadow:0 8px 24px #e8326b55}
#yes:active{transform:scale(.95)}
#no{background:transparent;color:var(--no);border:2px solid var(--no);font-size:17px;padding:11px 26px}
#no.run{position:fixed;z-index:5;transition:left .25s cubic-bezier(.3,1.6,.5,1),top .25s cubic-bezier(.3,1.6,.5,1)}
#no.dead{animation:crash 1.1s ease-in forwards}
@keyframes crash{15%{transform:rotate(-14deg) scale(1.2)}30%{transform:rotate(12deg) scale(1.2)}100%{transform:translateY(120vh) rotate(160deg);opacity:0}}
.wa{display:inline-block;margin-top:22px;background:#25d366;color:#073b1a;font-weight:700;font-size:18px;text-decoration:none;padding:14px 28px;border-radius:999px;box-shadow:0 8px 24px #25d36655}
.win{display:none}
.won .ask{display:none}.won .win{display:block}
.conf{position:fixed;top:-30px;z-index:9;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.emoji,.sky span{animation:none}}
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>
<main class="card" id="card">
  <div class="ask">
    <div class="emoji" id="face">🌙</div>
    <h1>Muraho Divine</h1>
    <p>Mfite ikibazo cy’ingenzi cyane, nkaba nkwinginze ukigeho utekereje neza…</p>
    <p style="margin-top:10px"><b>Ese gahunda yacu yo ku wa mbere iracyahari?</b></p>
    <div class="msg" id="msg"></div>
    <div class="row" id="row">
      <button id="yes">Yego, iracyahari ✨</button>
      <button id="no">Oya</button>
    </div>
  </div>
  <div class="win">
    <div class="emoji">🎉</div>
    <h1>Twabyemeranyijeho!</h1>
    <p>Nari nzi ko uri bubone igisubizo nyacyo 😄</p>
    <p style="margin-top:10px">Turabonana ku wa mbere, kandi ndakwizeza ko uzaba umunsi mwiza.</p>
    <a class="wa" href="https://wa.me/249925607582?text=Yego!%20Gahunda%20yo%20ku%20wa%20mbere%20iracyahari%20%F0%9F%8E%89" target="_blank" rel="noopener">Ohereza igisubizo cyawe 💬</a>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
const yes=$('yes'),no=$('no'),msg=$('msg'),face=$('face');
// floating hearts & stars
const sky=$('sky');
for(let i=0;i<22;i++){const s=document.createElement('span');s.textContent=['♥','✦','✧','♡'][i%4];
  s.style.cssText=`left:${Math.random()*100}%;font-size:${12+Math.random()*22}px;animation-duration:${9+Math.random()*12}s;animation-delay:${-Math.random()*18}s`;sky.appendChild(s)}
const lines=['Mmm, aka kabuto karasoni gato 😅','Urabyizeye? Ongera ubitekerezeho 🥺','Akabuto karagukwepa, nako karashaka kuza! 🏃','Reka nirengagize ibyo mbonye 🙈','Amahirwe ya nyuma… akabuto karananiwe 😰'];
const faces=['🌙','🥺','😳','🙈','😰'];
let tries=0,dead=false,scale=1;
function dodge(e){
  if(dead)return; e.preventDefault();
  tries++;
  if(tries>5){return crash()}
  msg.textContent=lines[tries-1]; face.textContent=faces[tries-1];
  scale+=.18; yes.style.transform=`scale(${scale})`;
  const w=no.offsetWidth,h=no.offsetHeight;
  if(!no.classList.contains('run')){const r=no.getBoundingClientRect();no.classList.add('run');no.style.left=r.left+'px';no.style.top=r.top+'px'}
  const pad=14,x=pad+Math.random()*(innerWidth-w-pad*2),y=pad+Math.random()*(innerHeight-h-pad*2);
  requestAnimationFrame(()=>{no.style.left=x+'px';no.style.top=y+'px'});
  no.style.transform=`rotate(${(Math.random()-.5)*30}deg) scale(${Math.max(.6,1-tries*.08)})`;
}
function crash(){
  dead=true;no.textContent='💥';no.classList.add('dead');
  msg.textContent='Yoo! Akabuto kamenetse 💔 Hasigaye uburyo bumwe gusa…';face.textContent='😏';
  yes.style.transform='scale(1.35)';
  setTimeout(()=>no.remove(),1200);
}
['pointerenter','touchstart','mousedown','click'].forEach(ev=>no.addEventListener(ev,dodge,{passive:false}));
yes.addEventListener('click',()=>{
  $('card').classList.add('won');
  const set=['🎉','💖','✨','🌸','🎊','💫'];
  for(let i=0;i<70;i++){const c=document.createElement('span');c.className='conf';c.textContent=set[i%set.length];
    c.style.cssText=`left:${Math.random()*100}%;font-size:${16+Math.random()*20}px;animation-duration:${2.5+Math.random()*2.5}s;animation-delay:${Math.random()*1.2}s`;
    document.body.appendChild(c);setTimeout(()=>c.remove(),7000)}
});
</script>
</body>
</html>
